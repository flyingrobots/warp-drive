[package]
name         = "warp-drive-g0-spike"
version      = "0.0.1"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "G0 spike: prove warp-wasm embeds and observes from outside the echo workspace"
publish      = false

[[bin]]
name = "g0-spike"
path = "src/main.rs"

# Spike does not inherit workspace lints — it is frozen G0 work, not
# maintained production code. Strict lints apply to warp-drive-core and
# warp-drive-fuse from G1 onward.

[dependencies]
echo-wasm-abi = { workspace = true }
warp-wasm     = { workspace = true, features = ["engine"] }
