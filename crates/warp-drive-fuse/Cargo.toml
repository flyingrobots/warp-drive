[package]
name         = "warp-drive-fuse"
version      = "0.0.1"
edition      = { workspace = true }
rust-version = { workspace = true }
license      = { workspace = true }
repository   = { workspace = true }
description  = "FUSE mount binary for WARP DRIVE (G1: in-memory fake tree)"
publish      = false

[[bin]]
name = "warp-drive-fuse"
path = "src/main.rs"

[features]
# Allow the crate to compile on macOS without macFUSE installed.
# The binary will build but `mount2` will return an error at runtime.
# Run `cargo xtask install-deps` to install macFUSE, then rebuild without
# this feature for a real mount.
compile-without-macfuse = ["fuser/macos-no-mount"]

[lints]
workspace = true

[dependencies]
warp-drive-core    = { workspace = true }
clap               = { workspace = true }
fuser              = { workspace = true }
libc               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
