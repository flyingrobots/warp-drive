[package]
name         = "warp-drive-fuse-echo"
version      = "0.0.1"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"
repository   = "https://github.com/flyingrobots/warp-drive"
description  = "Local-only Echo rlib FUSE binary for WARP DRIVE G2/G3 gates"
publish      = false

[[bin]]
name = "warp-drive-fuse"
path = "src/main.rs"

[dependencies]
warp-drive-core         = { path = "../warp-drive-core" }
warp-drive-fuse         = { path = "../warp-drive-fuse" }
warp-drive-echo-backend = { path = "../warp-drive-echo-backend" }

clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Excluded from `[workspace] members` — see warp-drive-echo-backend's
# Cargo.toml for why this duplicates the root lint tables instead of
# inheriting them.
[lints.rust]
warnings        = "deny"
missing_docs    = "deny"
unsafe_code     = "forbid"
unused_must_use = "deny"
unreachable_pub = "deny"

[lints.clippy]
all              = { level = "deny", priority = -1 }
unwrap_used      = "deny"
expect_used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
dbg_macro        = "deny"
print_stdout     = "deny"
print_stderr     = "deny"
wildcard_imports = "deny"
enum_glob_use    = "deny"
multiple_crate_versions = "allow"
