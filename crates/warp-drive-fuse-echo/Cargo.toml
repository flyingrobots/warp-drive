[package]
name         = "warp-drive-fuse-echo"
version      = "0.0.1"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"
repository   = "https://github.com/flyingrobots/warp-drive"
description  = "Local-only Echo rlib FUSE binary for WARP DRIVE G2a"
publish      = false

[[bin]]
name = "warp-drive-fuse"
path = "src/main.rs"

[dependencies]
warp-drive-core         = { path = "../warp-drive-core" }
warp-drive-fuse         = { path = "../warp-drive-fuse" }
warp-drive-echo-backend = { path = "../warp-drive-echo-backend" }

clap               = { version = "4", features = ["derive"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
