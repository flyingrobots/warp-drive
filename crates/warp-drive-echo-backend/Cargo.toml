[package]
name         = "warp-drive-echo-backend"
version      = "0.0.1"
edition      = "2024"
rust-version = "1.90.0"
license      = "Apache-2.0"
repository   = "https://github.com/flyingrobots/warp-drive"
description  = "Local-only Echo rlib projection backend for WARP DRIVE G2 gates"
publish      = false

[dependencies]
warp-drive-core = { path = "../warp-drive-core" }

echo-wasm-abi = { path = "../../../echo-warp-drive/crates/echo-wasm-abi" }
warp-wasm     = { path = "../../../echo-warp-drive/crates/warp-wasm", features = ["engine"] }
