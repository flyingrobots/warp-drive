name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  acceptance:
    name: G1 + G3 gate acceptance (Linux / Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - name: Run G1 acceptance
        run: cargo xtask acceptance
      - name: Run G3 acceptance (in-memory)
        run: cargo xtask acceptance --gate g3 --runtime in-memory

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
      - run: cargo test --workspace -- --show-output
        env:
          # This runner has been confirmed (2026-07-23) to mount FUSE for
          # real via crates/warp-drive-fuse/tests/mount_smoke.rs. Requiring
          # it here means a future regression (missing fusermount3, broken
          # binary, permission change) fails the build instead of quietly
          # degrading to a skip that still shows green.
          WARP_DRIVE_REQUIRE_FUSE: "1"

  lint:
    name: Clippy + fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.90.0"
          components: clippy,rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace -- -D warnings
